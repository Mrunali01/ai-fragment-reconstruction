[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jigsaw-ai"
version = "0.1.0"
description = "Reconstruct shuffled image fragments with computer vision and machine learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "numpy>=2.1,<3", "torch>=2.6,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
